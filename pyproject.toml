[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizengamot"
version = "0.2.0"
description = "Privacy-first multi-agent orchestration for Claude Code and the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["agents", "claude", "orchestration", "multi-agent", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "claude-agent-sdk>=0.2.143,<0.3",
]

[project.scripts]
wizengamot = "wizengamot.cli:main"
wiz = "wizengamot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
