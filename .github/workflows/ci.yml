name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install --editable . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: wizengamot --workspace examples/atlas validate
      - run: python scripts/privacy_check.py --all-public
      - run: wizengamot --workspace examples/atlas plan --campaign full-audit --json
